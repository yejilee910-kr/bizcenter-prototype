<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 내역 — 잡플래닛 기업</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif; background: #fff; color: #222; font-size: 14px; line-height: 1.5; }

/* ─── HEADER ─────────────────────── */
.gnb { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 40px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.gnb-logo { font-size: 18px; font-weight: 800; color: #222; display: flex; align-items: center; gap: 4px; }
.gnb-logo em { color: #00C362; font-style: normal; }
.gnb-right { display: flex; align-items: center; gap: 8px; }
.gnb-btn { padding: 5px 12px; border-radius: 4px; border: 1px solid #d0d0d0; background: #fff; font-size: 12px; color: #555; cursor: pointer; }
.gnb-btn:hover { background: #f5f5f5; }
.gnb-avatar { width: 28px; height: 28px; border-radius: 50%; background: #ddd; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #777; }

/* ─── LNB ───────────────────────── */
.lnb { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 0 40px; display: flex; align-items: flex-end; gap: 0; }
.lnb-tab { padding: 14px 16px; font-size: 14px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.lnb-tab:hover { color: #333; }
.lnb-tab.active { color: #00C362; font-weight: 700; border-bottom-color: #00C362; }

/* ─── PAGE CONTAINER ────────────── */
.container { max-width: 1060px; margin: 0 auto; padding: 40px 20px 80px; }
.page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
.page-desc { font-size: 14px; color: #888; margin-bottom: 28px; }

/* ─── ALERT BANNERS ─────────────── */
.alert { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; line-height: 1.5; }
.alert-error { background: #fff0f0; border: 1px solid #ffd6d6; color: #c0392b; }
.alert-warning { background: #fff8e6; border: 1px solid #ffe082; color: #b36000; }
.alert-info { background: #f0fff7; border: 1px solid #b2f0d0; color: #007a40; }
.alert strong { font-weight: 700; }
.alert-body { flex: 1; }
.alert-action { white-space: nowrap; font-weight: 700; color: inherit; text-decoration: underline; cursor: pointer; margin-left: 8px; }

/* ─── MEMBERSHIP CARD ───────────── */
.membership-card { background: #f8f8f8; border-radius: 8px; padding: 22px 24px; margin-bottom: 8px; position: relative; }
.membership-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.membership-card-label { font-size: 12px; color: #888; font-weight: 500; }
.tier-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.tier-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px; border-radius: 20px; font-size: 14px; font-weight: 700; }
.tier-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.tier-starter { background: #e8f5ff; color: #0070cc; }
.tier-allinone { background: #f0e8ff; color: #6b21a8; }
.tier-free { background: #f0f0f0; color: #777; }
.status-tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
.status-active { background: #e8fff3; color: #00a352; }
.status-failed { background: #fff0f0; color: #c0392b; }
.status-cancelled { background: #f0f0f0; color: #888; }
.membership-meta { display: flex; gap: 36px; }
.meta-item label { font-size: 12px; color: #999; display: block; margin-bottom: 3px; }
.meta-item .value { font-size: 14px; color: #1a1a1a; font-weight: 500; }
.meta-item .value.red { color: #c0392b; }
.meta-item .value.dim { color: #aaa; }
.link-btn { font-size: 13px; color: #00C362; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 2px; }
.link-btn:hover { text-decoration: underline; }

/* ─── SECTION TABS ──────────────── */
.section-tabs-row { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #e8e8e8; margin-bottom: 24px; margin-top: 32px; }
.section-tabs { display: flex; }
.section-tab { padding: 12px 16px; font-size: 14px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.section-tab:hover { color: #333; }
.section-tab.active { color: #1a1a1a; font-weight: 700; border-bottom-color: #1a1a1a; }
.section-tab-action { margin-bottom: 10px; }

/* ─── BUTTONS ───────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-green { background: #00C362; color: #fff; }
.btn-green:hover { background: #00a352; }
.btn-outline-green { background: #fff; color: #00C362; border: 1px solid #00C362; }
.btn-outline-green:hover { background: #f0fff7; }
.btn-outline-gray { background: #fff; color: #444; border: 1px solid #d0d0d0; }
.btn-outline-gray:hover { background: #f5f5f5; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ─── TABLE ─────────────────────── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table thead tr { border-bottom: 1px solid #e8e8e8; }
.data-table th { text-align: left; font-size: 13px; font-weight: 500; color: #888; padding: 0 12px 12px; }
.data-table td { padding: 14px 12px; font-size: 13px; border-bottom: 1px solid #f3f3f3; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.amount { font-weight: 700; color: #1a1a1a; }
.amount-cancelled { font-weight: 700; color: #aaa; text-decoration: line-through; }

/* ─── PAYMENT STATUS ────────────── */
.pay-status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; }
.pay-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.pay-status-success { color: #00a352; }
.pay-status-success .pay-dot { background: #00a352; }
.pay-status-failed { color: #c0392b; }
.pay-status-failed .pay-dot { background: #c0392b; }
.pay-status-cancelled { color: #888; }
.pay-status-cancelled .pay-dot { background: #999; }
.fail-reason { font-size: 11px; color: #c0392b; font-weight: 400; margin-top: 2px; }
.cancel-reason { font-size: 11px; color: #888; font-weight: 400; margin-top: 2px; }

/* ─── RECEIPT BUTTON ────────────── */
.btn-receipt { padding: 4px 10px; border-radius: 4px; border: 1px solid #d0d0d0; background: #fff; font-size: 12px; color: #555; cursor: pointer; }
.btn-receipt:hover { background: #f5f5f5; }
.btn-receipt:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; background: #fafafa; }

/* ─── EMPTY STATE ───────────────── */
.empty-state { text-align: center; padding: 60px 20px; color: #bbb; }
.empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; color: #aaa; }

/* ─── LOAD MORE ─────────────────── */
.load-more { text-align: center; padding: 14px; font-size: 13px; color: #00C362; cursor: pointer; font-weight: 600; }
.load-more:hover { text-decoration: underline; }

/* ─── PAYMENT NOTICE ────────────── */
.payment-notice { margin-top: 24px; padding: 18px 20px; background: #fafafa; border-radius: 6px; border: 1px solid #efefef; }
.payment-notice-title { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 10px; }
.payment-notice ul { font-size: 12px; color: #888; line-height: 1.9; list-style: none; padding: 0; }

/* ─── FOOTER ────────────────────── */
.footer { border-top: 1px solid #ebebeb; padding: 32px 40px; background: #fff; }
.footer-nav { display: flex; gap: 48px; margin-bottom: 24px; }
.footer-col-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #333; }
.footer-col a { display: block; font-size: 12px; color: #888; margin-bottom: 6px; cursor: pointer; }
.footer-col a:hover { color: #333; }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #f0f0f0; padding-top: 16px; }
.footer-legal { display: flex; gap: 16px; font-size: 12px; color: #999; }
.footer-legal a { cursor: pointer; color: #999; }
.footer-copy { font-size: 12px; color: #bbb; }

/* ─── DEMO SWITCHER ─────────────── */
.demo { position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 300; min-width: 220px; }
.demo p { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.demo-btn { display: block; width: 100%; text-align: left; padding: 6px 10px; border-radius: 6px; border: none; background: transparent; color: #99a0b4; font-size: 12px; cursor: pointer; margin-bottom: 2px; }
.demo-btn:hover, .demo-btn.active { background: rgba(0,195,98,0.15); color: #00C362; }
.demo-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 8px 0; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════
   PRD 상태 정의 (Phase0 PRD §3.3.4)
   ─────────────────────────────────────────────────
   코드 상태명   | 정의                               | 기관센 표현
   미결제       | PG 화면 호출 후 사용자 이탈            | 실패
   결제실패     | 정기결제 시도했으나 실패                | 실패
   결제완료     | 결제가 이뤄짐                         | 성공
   결제취소     | 결제 성공 후 전액 취소                  | 취소됨
   부분취소     | 결제 성공 후 일부 취소                  | 취소됨
   ═══════════════════════════════════════════════════ */

const CASES = {
  // ── Case 1: 정상 구독 — 성공 건만 ──
  'happy': {
    tier: 'starter', tierStatus: 'active',
    alert: null,

  // ── Case 2: 결제 실패 포함 (정기결제 실패 + 미결제) ──
  'with-failed': {
    tier: 'starter', tierStatus: 'failed',
    alert: { type: 'error', icon: '❗', body: '<strong>정기결제에 실패했습니다.</strong> 등록된 카드를 확인해 주세요. 2026.08.03까지 결제가 완료되지 않으면 Free로 전환됩니다.', action: '결제 수단 변경 →' },
    meta: { period: '2026.06.01 ~ 2026.06.30', nextPay: '-', amount: '₩99,000 / 월' },
    rows: [
      { date: '2026.07.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'failed', failCode: '결제실패', failReason: '카드 잔액 부족', receipt: false },
      { date: '2026.06.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },
      { date: '2026.05.15', product: 'Starter 월 정기', amount: '₩99,000', status: 'failed', failCode: '미결제', failReason: '사용자 이탈 (PG 미완료)', receipt: false },
      { date: '2026.05.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },
      { date: '2026.04.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },
    ],
    failCount: 2, cancelCount: 0
  },

  // ── Case 3: 실패 → 재결제 성공 (3회 재시도 중 성공) ──
  'retry-success': {
    tier: 'starter', tierStatus: 'active',

      { date: '2026.07.03', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true, note: '재결제 성공 (2차 재시도)' },
      { date: '2026.07.02', product: 'Starter 월 정기', amount: '₩99,000', status: 'failed', failCode: '결제실패', failReason: '카드 한도 초과 (1차 재시도)', receipt: false },
      { date: '2026.07.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'failed', failCode: '결제실패', failReason: '카드 잔액 부족 (최초 시도)', receipt: false },
      { date: '2026.06.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },
      { date: '2026.05.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },

    failCount: 2, cancelCount: 0

  // ── Case 4: 취소됨 포함 (결제취소 + 부분취소) ──
  'with-cancel': {
    tier: 'starter', tierStatus: 'active',
    alert: null,
    meta: { period: '2026.07.01 ~ 2026.07.30', nextPay: '2026.07.31', amount: '₩99,000 / 월' },
    rows: [
      { date: '2026.07.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true },
      { date: '2026.06.02', product: 'Starter 월 정기', amount: '₩99,000', status: 'cancelled', cancelType: '결제취소', cancelReason: '오결제 — 3일 이내 미사용 전액 환불', cancelDate: '2026.06.02', receipt: true },
      { date: '2026.06.01', product: 'Starter 월 정기', amount: '₩99,000', status: 'success', receipt: true, note: '재결제' },

  'mixed': {
    tier: 'allinone', tierStatus: 'active',
    alert: null,
    meta: { period: '2026.07.01 ~ 2026.07.30', nextPay: '2026.07.31', amount: '₩550,000 / 월' },

      { date: '2026.04.16', product: '연봉 분석 티켓 3장', amount: '₩165,000', status: 'cancelled', cancelType: '결제취소', cancelReason: '운영팀 처리', cancelDate: '2026.04.16', receipt: true },
      { date: '2026.04.01', product: 'All-in-One 월 정기', amount: '₩550,000', status: 'success', receipt: true },
      { date: '2026.03.01', product: 'All-in-One 월 정기', amount: '₩550,000', status: 'success', receipt: true },

      { date: '2026.01.15', product: '기업멤버십(All-in-One) 1년 이용권', amount: '₩4,620,000', status: 'success', receipt: true },

  // ── Case 6: Free 기업 — 결제 이력 없음 ──
  'free': {
    tier: 'free', tierStatus: 'none',
    alert: { type: 'info', icon: '💡', body: 'Starter 플랜으로 업그레이드하면 추천 리뷰 설정, 현직원 설문, 방문자 현황 등 브랜딩 기능을 이용할 수 있어요.', action: '플랜 보기 →' },
    meta: null,
    rows: [],
    failCount: 0, cancelCount: 0
  }
};

/* ═══ STATE ═══════════════════════════════════════ */
let currentCase = 'happy';

/* ═══ RENDER ═════════════════════════════════════ */
function render() {
  const c = CASES[currentCase];
  renderAlert(c);
  renderMembershipCard(c);
  renderSectionTabs(c);
  renderTable(c);
}

function renderAlert(c) {
  const el = document.getElementById('alert-area');
  if (!c.alert) { el.innerHTML = ''; return; }
  const a = c.alert;
  el.innerHTML = `<div class="alert alert-${a.type}">
    <div style="font-size:18px;flex-shrink:0;">${a.icon}</div>
    <div class="alert-body">${a.body}</div>
    ${a.action ? `<span class="alert-action">${a.action}</span>` : ''}
  </div>`;
}

function renderMembershipCard(c) {
  const el = document.getElementById('membership-card-area');

  if (c.tier === 'free') {
    el.innerHTML = `<div class="membership-card">
      <div style="margin-bottom:8px;font-size:13px;color:#888;font-weight:500;">현재 멤버십</div>
      <div style="font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:6px;">구독중인 멤버십이 없습니다</div>
      <div style="font-size:13px;color:#aaa;margin-bottom:12px;">멤버십을 구매하고 기업 브랜딩을 강화하세요</div>
      <span class="link-btn">멤버십 구매 ›</span>
    </div>`;
    return;
  }

  const tierClass = c.tier === 'allinone' ? 'tier-allinone' : 'tier-starter';
  const tierName = c.tier === 'allinone' ? 'All-in-One' : 'Starter';
  const statusClass = c.tierStatus === 'failed' ? 'status-failed' : 'status-active';
  const statusLabel = c.tierStatus === 'failed' ? '결제 실패' : '정기결제 중';

  el.innerHTML = `<div class="membership-card">
    <div class="membership-card-header">
      <span class="membership-card-label">현재 멤버십</span>
    </div>
    <div class="tier-row">
      <div class="tier-badge ${tierClass}"><span class="tier-badge-dot"></span>${tierName}</div>
      <span class="status-tag ${statusClass}">${statusLabel}</span>
    </div>
    <div class="membership-meta">
      <div class="meta-item"><label>멤버십 기간</label><div class="value">${c.meta.period}</div></div>
      <div class="meta-item"><label>다음 결제일</label><div class="value${c.tierStatus === 'failed' ? ' red' : ''}">${c.meta.nextPay}</div></div>
      <div class="meta-item"><label>결제 금액</label><div class="value">${c.meta.amount}</div></div>
    </div>
  </div>`;
}

function renderSectionTabs(c) {
  const el = document.getElementById('section-tabs-area');
  const isPaid = c.tier !== 'free';
  el.innerHTML = `<div class="section-tabs-row">
    <div class="section-tabs">
      <div class="section-tab">결제 수단</div>
      <div class="section-tab active">결제 내역</div>
      <div class="section-tab">변경 이력</div>
    </div>
    <div class="section-tab-action">
      <button class="btn ${isPaid ? 'btn-green' : 'btn-outline-green'} btn-sm">${isPaid ? '결제 수단 관리' : '기업 멤버십 문의'}</button>
    </div>
  </div>`;
}

function renderTable(c) {
  const el = document.getElementById('tab-content');

  // Empty state (Free)
  if (c.rows.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>결제 내역이 없습니다</p>
      <p style="margin-top:4px;">멤버십을 구매하면 이곳에서 결제 내역을 확인할 수 있어요</p>
    </div>`;
    return;
  }

  const rows = c.rows;

  const rowsHtml = rows.map(r => {
    // Status
    let statusHtml = '';
    if (r.status === 'success') {
      statusHtml = `<span class="pay-status pay-status-success"><span class="pay-dot"></span>성공</span>`;
    } else if (r.status === 'failed') {
      statusHtml = `<span class="pay-status pay-status-failed"><span class="pay-dot"></span>실패</span>`;
      if (r.failReason) statusHtml += `<div class="fail-reason">${r.failReason}</div>`;
    } else if (r.status === 'cancelled') {
      statusHtml = `<span class="pay-status pay-status-cancelled"><span class="pay-dot"></span>취소됨</span>`;
      let detail = r.cancelType || '';
      if (r.cancelReason) detail += (detail ? ' · ' : '') + r.cancelReason;
      if (r.cancelDate) detail += ` (${r.cancelDate})`;
      if (detail) statusHtml += `<div class="cancel-reason">${detail}</div>`;
    }

    // Date (PRD: "일자" 컬럼)
    let dateHtml = r.date;
    if (r.note) dateHtml += `<div style="font-size:11px;color:#888;margin-top:2px;">${r.note}</div>`;

    // Amount
    let amountHtml;
    if (r.status === 'cancelled' && r.partialAmount) {
      amountHtml = `<span class="amount-cancelled">${r.amount}</span><div style="font-size:12px;color:#888;margin-top:2px;">부분취소 ${r.partialAmount}</div>`;
    } else if (r.status === 'cancelled') {
      amountHtml = `<span class="amount-cancelled">${r.amount}</span>`;
    } else {
      amountHtml = `<span class="amount">${r.amount}</span>`;
    }

    // Receipt
    const receiptHtml = r.receipt
      ? `<button class="btn-receipt">전표 출력</button>`
      : `<button class="btn-receipt" disabled>-</button>`;

    return `<tr>
      <td>${r.product}</td>
      <td>${dateHtml}</td>
      <td>${amountHtml}</td>
      <td>${statusHtml}</td>
      <td>${receiptHtml}</td>
    </tr>`;
  }).join('');

  const tableHtml = `<table class="data-table">
    <thead><tr>
      <th style="width:28%">상품</th>
      <th style="width:14%">일자</th>
      <th style="width:16%">결제 금액</th>
      <th style="width:24%">결제 상태</th>
      <th style="width:18%">전표 발급</th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;

  const loadMore = rows.length >= 5 ? `<div class="load-more">더보기 ↓</div>` : '';

  el.innerHTML = tableHtml + loadMore + renderNotice();
}

function renderNotice() {
  return `<div class="payment-notice">
    <div class="payment-notice-title">유의사항</div>
    <ul>
      <li>· 계좌 이체로 결제하는 기업은 결제일 정보를 확인할 수 없어요</li>
      <li>· 결제 수단은 멤버십을 구독하는 기업만 추가할 수 있어요</li>
      <li>· 결제수단은 최대 10개까지 등록할 수 있으며, 서비스 해지 시 기존에 저장된 결제 수단 정보가 사라져요</li>
      <li>· 결제 실패 후 카드를 변경하신 경우, 변경된 카드로 익일 오전에 재결제가 진행돼요</li>
      <li>· 정기결제 실패 시 3회까지 매일 재시도하며, 3회 실패 시 Free로 전환됩니다</li>
      <li>· 결제 후 3일 이내 서비스 미이용 시 전액 환불이 가능합니다</li>
      <li>· 문의: partners@jobplanet.com 또는 고객센터</li>
    </ul>
  </div>`;
}

/* ═══ ACTIONS ════════════════════════════════════ */
function setCase(caseName, btn) {
  currentCase = caseName;
  document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

/* ═══ INIT ═══════════════════════════════════════ */
render();
</script>
</body>
</html>
